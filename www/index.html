<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7f0">
<title>宝宝成长册</title>
<style>
  :root{
    --bg:#fff7f0; --card:#ffffff; --ink:#3d2b1f; --sub:#8b7566;
    --line:#f0e2d6; --a1:#f2a25c; --a2:#8fc4a8; --shadow:0 2px 10px rgba(140,100,60,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    max-width:520px;margin:0 auto;padding-bottom:96px;
  }
  header{
    position:sticky;top:0;z-index:10;background:rgba(255,247,240,.94);
    backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
  }
  h1{margin:0 0 10px;font-size:19px;letter-spacing:.5px}
  h1 span{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
  .tabs{display:flex;gap:8px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--sub);
    padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;transition:.15s;
  }
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .toolbar{display:flex;gap:14px;justify-content:flex-end;padding:8px 16px 0}
  .mini{
    border:none;background:none;color:var(--sub);font-size:12px;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;padding:4px
  }
  main{padding:14px 16px 0}
  .day-label{font-size:12px;color:var(--sub);margin:18px 0 8px;letter-spacing:1px}
  .card{
    background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px;
    box-shadow:var(--shadow);position:relative;animation:in .25s ease both;
  }
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;background:#fdeadd;color:#b06a2c}
  .badge.b{background:#e6f2ec;color:#3f7d5f}
  .badge.s{background:#eaedf6;color:#5a6a92}
  .age{font-size:11px;color:var(--sub)}
  .txt{white-space:pre-wrap;word-break:break-word}
  .shots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .shots img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:#f5ede6}
  .del{
    position:absolute;top:8px;right:8px;border:none;background:none;color:#cbb8a8;
    font-size:16px;line-height:1;padding:6px;cursor:pointer
  }
  .empty{text-align:center;color:var(--sub);padding:60px 20px;font-size:14px}
  .fab{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom, 0px));z-index:20;
    width:calc(100% - 32px);max-width:488px;height:52px;border:none;border-radius:26px;
    background:linear-gradient(135deg,#f2a25c,#e88f4a);color:#fff;font-size:16px;font-weight:600;
    box-shadow:0 8px 24px rgba(232,143,74,.35);cursor:pointer
  }
  .sheet{position:fixed;inset:0;z-index:30;display:none;background:rgba(60,40,25,.35)}
  .sheet.on{display:block}
  .panel{
    position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;
    padding:18px 18px calc(26px + env(safe-area-inset-bottom, 0px));max-width:520px;margin:0 auto;
    animation:up .25s ease both;max-height:92vh;overflow:auto
  }
  @keyframes up{from{transform:translateY(30px)}to{transform:none}}
  .panel h2{margin:0 0 14px;font-size:16px}
  .row{margin-bottom:12px}
  label.fl{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
  input[type=date],input[type=text],select,textarea{
    width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;
    font:15px/1.5 inherit;color:var(--ink);background:#fffdfb;outline:none
  }
  textarea{min-height:96px;resize:vertical}
  .pickers{display:flex;gap:8px;margin-bottom:8px}
  .pick{
    flex:1;text-align:center;border:1px dashed #e6d3c2;border-radius:12px;padding:12px 8px;
    font-size:13px;color:#a07a56;background:#fffdfb;cursor:pointer
  }
  .pick:active{background:#fdf1e6}
  .preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .thumb{position:relative;width:72px;height:72px}
  .thumb img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block}
  .thumb button{
    position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:none;
    background:#3d2b1f;color:#fff;font-size:13px;line-height:22px;text-align:center;padding:0;cursor:pointer
  }
  .save{
    width:100%;height:48px;border:none;border-radius:14px;margin-top:6px;
    background:var(--ink);color:#fff;font-size:15px;font-weight:600;cursor:pointer
  }
  .hint{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.7}
  .cfgrow{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:end;margin-bottom:12px}
  .cfgrow label{margin-bottom:4px}
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:40;
    background:rgba(61,43,31,.92);color:#fff;padding:9px 16px;border-radius:999px;
    font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:80%;text-align:center
  }
  .toast.on{opacity:1}
  #warn{
    display:none;background:#fff3cd;color:#8a6d3b;font-size:12px;
    padding:6px 16px;border-bottom:1px solid #f3e3b8;line-height:1.5
  }
</style>
</head>
<body>
<header>
  <h1>宝宝成长册<span id="ver"></span></h1>
  <div class="tabs" id="tabs"></div>
</header>
<div id="warn"></div>

<div class="toolbar">
  <button class="mini" id="btnCfg">改名字/生日</button>
  <button class="mini" id="btnExport">导出备份</button>
  <button class="mini" id="btnImport">导入备份</button>
  <input type="file" id="fileImport" accept="application/json" hidden>
</div>

<main id="list"></main>

<button class="fab" id="btnAdd">＋ 记一条</button>

<!-- 新建记录 -->
<div class="sheet" id="sheet">
  <div class="panel">
    <h2>新记录</h2>
    <div class="row">
      <label class="fl">是谁</label>
      <select id="fKid"></select>
    </div>
    <div class="row">
      <label class="fl">日期</label>
      <input type="date" id="fDate">
    </div>
    <div class="row">
      <label class="fl">写点什么</label>
      <textarea id="fText" placeholder="例：今天第一次自己扶着沙发站起来，笑得特别得意。"></textarea>
    </div>
    <div class="row">
      <label class="fl">照片（会自动压缩，最多 9 张）</label>
      <div class="pickers">
        <label class="pick">🖼 从相册选<input type="file" id="fPick" accept="image/*" multiple hidden></label>
        <label class="pick">📷 拍照<input type="file" id="fCam" accept="image/*" capture="environment" hidden></label>
      </div>
      <div class="preview" id="preview"></div>
    </div>
    <button class="save" id="btnSave">保存</button>
    <p class="hint">数据存在这台设备的 app 里。换手机前点“导出备份”，可以把文件分享到微信/QQ/网盘带走。</p>
  </div>
</div>

<!-- 设置 -->
<div class="sheet" id="sheetCfg">
  <div class="panel">
    <h2>名字和生日</h2>
    <p class="hint" style="margin:0 0 14px">名字随便改；生日用来算“出生多少天 / 几个月”。合照那一栏没有生日。</p>
    <div id="cfgList"></div>
    <button class="save" id="btnCfgSave">保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   0. 运行环境判断（浏览器 / app 外壳）
   ============================================================ */
const Cap = window.Capacitor || null;
const isNative = !!(Cap && typeof Cap.isNativePlatform==='function' && Cap.isNativePlatform());
const CapApp   = isNative ? Cap.registerPlugin('App')        : null;
const CapFS    = isNative ? Cap.registerPlugin('Filesystem') : null;
const CapShare = isNative ? Cap.registerPlugin('Share')      : null;
document.getElementById('ver').textContent = isNative ? 'app 版' : '网页版';

/* ============================================================
   1. 名单
   ============================================================ */
const KIDS_KEY='gb-kids', SEED_KEY='gb-seeded';
const DEFAULT_KIDS=[
  {id:'k1', name:'大宝', birth:'2023-05-12', cls:''},
  {id:'k2', name:'二宝', birth:'2025-11-03', cls:'b'},
  {id:'k3', name:'合照', birth:'',           cls:'s'}
];
let KIDS = loadKids();
let filter='all', pendingPhotos=[];

function loadKids(){
  try{
    const s=localStorage.getItem(KIDS_KEY);
    if(s){ const a=JSON.parse(s); if(Array.isArray(a)&&a.length) return a; }
  }catch(e){}
  return DEFAULT_KIDS.map(k=>({...k}));
}
function saveKids(){ try{ localStorage.setItem(KIDS_KEY, JSON.stringify(KIDS)); }catch(e){} }

/* ============================================================
   2. 存储：优先 IndexedDB，失败退到 localStorage，再退到内存
   ============================================================ */
const DB_NAME='growth-book', STORE='entries', LS_KEY='gb-entries';
let backend='mem', memStore=[], dbPromise=null;

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('no idb'));
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>{ const db=r.result; if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE,{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked'));
  });
  return dbPromise;
}

async function initBackend(){
  try{ await openDB(); backend='idb'; return; }catch(e){}
  try{
    localStorage.setItem('gb-test','1'); localStorage.removeItem('gb-test');
    backend='ls';
  }catch(e){ backend='mem'; }
}

function lsAll(){
  const s=localStorage.getItem(LS_KEY);
  return s ? JSON.parse(s) : [];
}
function lsSave(rows){ localStorage.setItem(LS_KEY, JSON.stringify(rows)); }

function sorted(rows){ return rows.sort((a,b)=>(b.date+b.id).localeCompare(a.date+a.id)); }

async function allEntries(){
  if(backend==='idb'){
    const db=await openDB();
    return new Promise((res,rej)=>{
      const tx=db.transaction(STORE,'readonly').objectStore(STORE).getAll();
      tx.onsuccess=()=>res(sorted(tx.result)); tx.onerror=()=>rej(tx.error);
    });
  }
  if(backend==='ls') return sorted(lsAll());
  return sorted(memStore.slice());
}
async function putEntry(e){
  if(backend==='idb'){
    const db=await openDB();
    return new Promise((res,rej)=>{
      const tx=db.transaction(STORE,'readwrite').objectStore(STORE).put(e);
      tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error);
    });
  }
  if(backend==='ls'){ const rows=lsAll().filter(r=>r.id!==e.id); rows.push(e); lsSave(rows); return; }
  memStore=memStore.filter(r=>r.id!==e.id); memStore.push(e);
}
async function delEntry(id){
  if(backend==='idb'){
    const db=await openDB();
    return new Promise((res,rej)=>{
      const tx=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);
      tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error);
    });
  }
  if(backend==='ls'){ lsSave(lsAll().filter(r=>r.id!==id)); return; }
  memStore=memStore.filter(r=>r.id!==id);
}

/* ============================================================
   3. 小工具
   ============================================================ */
function today(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function ageText(kidId,dateStr){
  const k=KIDS.find(x=>x.id===kidId);
  if(!k || !k.birth) return '';
  const b=new Date(k.birth), d=new Date(dateStr);
  const days=Math.floor((d-b)/86400000);
  if(!isFinite(days) || days<0) return '';
  if(days<60) return `出生 ${days} 天`;
  const months=Math.floor(days/30.44);
  if(months<24) return `${months} 个月`;
  return `${Math.floor(months/12)} 岁 ${months%12} 个月`;
}
function fmtDate(s){ const d=new Date(s); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('on'),1800);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){
  return String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
}
function placeholder(color,label){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="${color}"/><text x="150" y="180" font-size="100" text-anchor="middle" fill="rgba(255,255,255,.92)">${label}</text></svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(svg);
}

/* ============================================================
   4. 首屏示例数据（只在第一次打开时写一次）
   ============================================================ */
async function seedIfEmpty(){
  if(localStorage.getItem(SEED_KEY)) return;
  const demo=[
    {kid:'k1',date:'2026-09-18',text:'第一次自己扶着沙发站起来，站了大概十秒，然后一屁股坐回去，笑得特别得意。',photos:[placeholder('#f2a25c','🧸'),placeholder('#e8b48a','🍼')]},
    {kid:'k1',date:'2026-10-02',text:'会叫“爸爸”了，一天叫四十遍，看到狗也叫爸爸。',photos:[placeholder('#d8a06a','👶')]},
    {kid:'k2',date:'2026-10-11',text:'今天满月，体重 4.8 公斤。比哥哥同期重半斤。',photos:[placeholder('#8fc4a8','🌱')]},
    {kid:'k2',date:'2026-10-20',text:'第一次笑出声，逗一下就咯咯咯。',photos:[placeholder('#a8d4bd','😊'),placeholder('#c8e2d2','☀️')]},
    {kid:'k3',date:'2026-10-01',text:'国庆全家出门，第一次带两个一起拍合照，老大的手一直抓着弟弟的脚。',photos:[placeholder('#9fb6d8','👨‍👩‍👦‍👦')]}
  ];
  try{
    for(const d of demo) await putEntry({id:uid(),...d,created:Date.now()});
    localStorage.setItem(SEED_KEY,'1');
  }catch(e){}
}

/* ============================================================
   5. 渲染
   ============================================================ */
function renderTabs(){
  const el=document.getElementById('tabs');
  const items=[{id:'all',name:'全部'},...KIDS.map(k=>({id:k.id,name:k.name}))];
  el.innerHTML=items.map(i=>`<button class="tab ${filter===i.id?'on':''}" data-id="${i.id}">${esc(i.name)}</button>`).join('');
  el.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{filter=b.dataset.id;renderTabs();renderList();});
}

async function renderList(){
  const list=document.getElementById('list');
  let rows;
  try{ rows=await allEntries(); }catch(e){ rows=[]; }
  if(filter!=='all') rows=rows.filter(r=>r.kid===filter);
  if(!rows.length){
    list.innerHTML='<div class="empty">这里还空着<br>点下面的按钮，记第一条</div>';
    return;
  }
  let html='',lastDay='';
  for(const r of rows){
    if(r.date!==lastDay){ lastDay=r.date; html+=`<div class="day-label">${fmtDate(r.date)}</div>`; }
    const k=KIDS.find(x=>x.id===r.kid)||{name:'?',cls:''};
    const shots=(r.photos||[]).map(p=>`<img src="${p}" alt="">`).join('');
    html+=`<div class="card">
      <button class="del" data-id="${r.id}" title="删除">✕</button>
      <div class="meta">
        <span class="badge ${k.cls||''}">${esc(k.name)}</span>
        <span class="age">${ageText(r.kid,r.date)}</span>
      </div>
      <div class="txt">${esc(r.text)}</div>
      ${shots?`<div class="shots">${shots}</div>`:''}
    </div>`;
  }
  list.innerHTML=html;
  list.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{
    if(!confirm('删掉这条？删了不能恢复。')) return;
    await delEntry(b.dataset.id); renderList(); toast('已删除');
  });
}

/* ============================================================
   6. 新增记录
   ============================================================ */
function renderPreview(){
  const box=document.getElementById('preview');
  box.innerHTML=pendingPhotos.map((p,i)=>`<div class="thumb"><img src="${p}"><button data-i="${i}">✕</button></div>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    pendingPhotos.splice(+b.dataset.i,1); renderPreview();
  });
}

function openSheet(){
  document.getElementById('fKid').innerHTML=KIDS.map(k=>{
    const a=ageText(k.id,today());
    return `<option value="${k.id}">${esc(k.name)}${a?'（'+a+'）':''}</option>`;
  }).join('');
  document.getElementById('fDate').value=today();
  document.getElementById('fText').value='';
  document.getElementById('fPick').value='';
  document.getElementById('fCam').value='';
  pendingPhotos=[]; renderPreview();
  document.getElementById('sheet').classList.add('on');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }

function shrink(file, max=1400, q=.82){
  return new Promise(res=>{
    try{
      const img=new Image();
      img.onload=()=>{
        try{
          let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
          const s=Math.min(1,max/Math.max(w,h));
          const c=document.createElement('canvas');
          c.width=Math.round(w*s); c.height=Math.round(h*s);
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          res(c.toDataURL('image/jpeg',q));
        }catch(e){ res(''); }
      };
      img.onerror=()=>res('');
      img.src=URL.createObjectURL(file);
    }catch(e){ res(''); }
  });
}

async function takePhotos(ev){
  const files=[...ev.target.files];
  if(!files.length) return;
  toast('正在处理照片…');
  for(const f of files){
    if(pendingPhotos.length>=9){ toast('最多 9 张'); break; }
    const d=await shrink(f);
    if(d) pendingPhotos.push(d);
  }
  renderPreview();
  ev.target.value='';
  toast(pendingPhotos.length?`共 ${pendingPhotos.length} 张`:'照片读取失败');
}
document.getElementById('fPick').onchange=takePhotos;
document.getElementById('fCam').onchange=takePhotos;

document.getElementById('btnSave').onclick=async()=>{
  const text=document.getElementById('fText').value.trim();
  if(!text && !pendingPhotos.length){ toast('写一句话或加张照片'); return; }
  try{
    await putEntry({
      id:uid(),
      kid:document.getElementById('fKid').value,
      date:document.getElementById('fDate').value||today(),
      text, photos:pendingPhotos.slice(), created:Date.now()
    });
    closeSheet(); renderList(); toast('记好了');
  }catch(e){
    toast('保存失败：'+(e.message||e));
  }
};

document.getElementById('btnAdd').onclick=openSheet;

/* ============================================================
   7. 设置：改名 / 生日
   ============================================================ */
function openSettings(){
  const box=document.getElementById('cfgList');
  box.innerHTML=KIDS.map((k,i)=>`
    <div class="cfgrow">
      <div>
        <label class="fl">名称</label>
        <input type="text" data-i="${i}" data-f="name" value="${esc(k.name)}" maxlength="8">
      </div>
      <div>
        <label class="fl">生日</label>
        <input type="date" data-i="${i}" data-f="birth" value="${k.birth||''}" ${k.birth===''?'disabled':''}>
      </div>
    </div>`).join('');
  document.getElementById('sheetCfg').classList.add('on');
}
function closeSettings(){ document.getElementById('sheetCfg').classList.remove('on'); }

document.getElementById('btnCfg').onclick=openSettings;
document.getElementById('btnCfgSave').onclick=()=>{
  document.querySelectorAll('#cfgList input').forEach(inp=>{
    const i=+inp.dataset.i, f=inp.dataset.f;
    if(f==='birth' && KIDS[i].birth==='') return;
    const v=inp.value.trim();
    if(f==='name'){ if(v) KIDS[i].name=v; }
    else KIDS[i].birth=v;
  });
  saveKids(); closeSettings(); renderTabs(); renderList(); toast('已保存');
};

/* ============================================================
   8. 备份：app 里走“分享”，浏览器里走下载
   ============================================================ */
async function exportBackup(){
  let rows=[];
  try{ rows=await allEntries(); }catch(e){}
  const json=JSON.stringify({kids:KIDS,entries:rows},null,2);
  const name=`宝宝成长册-备份-${today()}.json`;

  if(isNative && CapFS && CapShare){
    try{
      const w=await CapFS.writeFile({path:name, data:json, directory:'CACHE', encoding:'utf8'});
      await CapShare.share({title:'宝宝成长册备份', text:'把备份发到微信/QQ/网盘', url:w.uri});
      toast('备份已生成，选一个 App 发出去');
      return;
    }catch(e){
      toast('分享失败：'+(e.message||e));
      return;
    }
  }

  try{
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('已导出');
  }catch(e){ toast('导出失败：'+(e.message||e)); }
}
document.getElementById('btnExport').onclick=exportBackup;

document.getElementById('btnImport').onclick=()=>document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange=async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  let data;
  try{ data=JSON.parse(await f.text()); }catch(e){ toast('这个文件读不出来'); ev.target.value=''; return; }
  if(!data.entries || !data.entries.length){ toast('文件里没有记录'); ev.target.value=''; return; }
  if(!confirm(`导入 ${data.entries.length} 条记录？（不会删除已有记录）`)){ ev.target.value=''; return; }
  if(Array.isArray(data.kids)&&data.kids.length){
    if(confirm('备份里带了名字和生日，要不要用它覆盖当前设置？')){ KIDS=data.kids; saveKids(); }
  }
  let ok=0;
  for(const e of data.entries){ try{ await putEntry(e); ok++; }catch(err){} }
  ev.target.value='';
  renderTabs(); renderList(); toast(`导入完成（${ok} 条）`);
};

/* ============================================================
   9. 安卓返回键：弹层打开就先关弹层
   ============================================================ */
if(CapApp && CapApp.addListener){
  try{
    CapApp.addListener('backButton', ()=>{
      const open=document.querySelector('.sheet.on');
      if(open){ open.classList.remove('on'); return; }
      CapApp.exitApp();
    });
  }catch(e){}
}

/* ============================================================
   10. 启动
   ============================================================ */
(async function boot(){
  // 先把静态结构画出来，即使存储不可用也不会白屏
  renderTabs();
  await initBackend();
  if(backend!=='idb'){
    const w=document.getElementById('warn');
    w.style.display='block';
    w.textContent = backend==='ls'
      ? '提示：当前用的是简化存储（localStorage），照片多时可能存不下。'
      : '提示：当前环境不允许保存数据，刷新后会丢失（仅用于预览界面）。';
  }
  await seedIfEmpty();
  await renderList();
})();
</script>
